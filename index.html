<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>trophy husband</title>
<style>
html{height:500px}

</style></head>
<body>
<div id="out"></div>
<div id="nav"><a href="02.html">&lsaquo;</a><span>01 / 08</span><a href="02.html">&rsaquo;</a></div>
<script>
var out=document.getElementById('out');
var node=document.createTextNode('');
var cur=document.createElement('span');
cur.id='cur';
cur.style.animation='blink .9s steps(1) infinite';
out.appendChild(node);
out.appendChild(cur);

var BOOT='\n\nDELPHINE BBS  \u00b7  NODE 01  \u00b7  28.8K\n\nCARRIER DETECT\n\nLOGIN: guest\nPASSWORD: ****\n\nLAST CALL ......... 12.04.97\nFILES ............. 08 PAGES\n\nREADING /INDEX.HTM\n';
var A='hello trophy husband';
var B='press <ENTER> to access the site';
var full=A+'\n\n'+B+'\n'+BOOT;

var i=0, started=false, timer=null;

function go(){location.href='02.html'}
function step(){
  started=true;
  cur.style.animation='none';
  cur.style.opacity='1';
  node.nodeValue=full.slice(0,i);
  i++;
  if(i<=full.length){ timer=setTimeout(step,26); }
  else { setTimeout(go,1300); }
}

setTimeout(step,1750);

document.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
document.addEventListener('click',function(){ go(); });
</script>
