a{color:#0000EE;text-decoration:underline}

a:hover{background:#0000EE;color:#fff;text-decoration:none}
.page{position:absolute;inset:0;overflow:hidden;padding:12px 14px 0;box-sizing:border-box}

.cols{display:flex;gap:16px}
.rail{flex:0 0 96px;font-size:12px;line-height:1.75}
.rail a{display:block}
.rail .h{font-style:italic;margin-bottom:1px}
.lead{flex:1 1 auto;min-width:0}
.pic{display:block;max-width:100%;max-height:160px;margin:0 auto 8px}
h2{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:23px;margin:0 0 6px;line-height:.98}
.body{margin:0 0 7px}
.read{font-size:12px;display:block}
.log{flex:0 0 168px;font-size:11.5px;line-height:1.4}
.log .h{font-style:italic;margin-bottom:2px}
.log .e{padding:2px 0 3px}
.foot{position:absolute;left:0;right:0;bottom:8px;padding:0 14px;font-size:11.5px;text-align:center}
@media (max-width:780px){
#stage{width:100%;height:100%}
.page{position:relative;inset:auto;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px}
.mast{flex-wrap:nowrap}
h1{white-space:nowrap}
h2{white-space:nowrap}
.tag{flex:0 0 auto}
.cols{flex-direction:column;gap:12px}
.rail{order:-1}
.pic{max-height:23vh;width:auto}
h2{font-size:21px}
.rail{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;line-height:1.4}
.rail .h{width:100%;margin:0}
.log{flex:0 0 auto;font-size:12px}
.foot{position:relative;bottom:auto;margin-top:14px;padding:0;text-align:left}
}
</style></head>
